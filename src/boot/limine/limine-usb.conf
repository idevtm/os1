timeout: 10
serial: yes
verbose: yes

/os1
    protocol: limine
    path: boot():/kernel_limine.elf
    module_path: boot():/kernel.elf
    module_path: boot():/initrd.cpio
    resolution: 1024x768x32

/os1 (no xHCI)
    protocol: limine
    path: boot():/kernel_limine.elf
    cmdline: os1.noxhci
    module_path: boot():/kernel.elf
    module_path: boot():/initrd.cpio
    resolution: 1024x768x32

/os1 (no xHCI, one CPU)
    protocol: limine
    path: boot():/kernel_limine.elf
    cmdline: os1.noxhci os1.nosmp
    module_path: boot():/kernel.elf
    module_path: boot():/initrd.cpio
    resolution: 1024x768x32
