timeout: 10
default_entry: 1
serial: yes
verbose: yes

/os1
    protocol: limine
    path: boot():/kernel_limine.elf
    module_path: boot():/kernel.elf
    module_path: boot():/initrd.cpio
    resolution: 1024x768x32

/os1 diagnostics
    protocol: limine
    path: boot():/kernel_limine.elf
    cmdline: os1.log=diagnostic os1.bootdiag
    module_path: boot():/kernel.elf
    module_path: boot():/initrd.cpio
    resolution: 1024x768x32
