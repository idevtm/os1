name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${ACT:-}" = "true" ]; then
            # Local act runs this job directly on the host, so we reuse the
            # developer's toolchain instead of trying to recreate a GitHub
            # runner inside Docker.
            command -v cmake
            command -v ninja
            command -v nasm
            command -v cpio
            command -v xorriso
            command -v qemu-system-x86_64
          else
            sudo apt-get update
            sudo apt-get install -y e2fsprogs nasm cpio xorriso ovmf qemu-system-x86 cmake ninja-build \
              libgmp10 libmpfr6 libmpc3
          fi

      - name: Configure host unit tests
        run: cmake -S tests/host -B build-host-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOS1_KMEM_DEBUG=ON

      - name: Build host unit tests
        run: cmake --build build-host-tests

      - name: Run host unit tests
        run: ctest --test-dir build-host-tests --output-on-failure --no-tests=error

      - name: Cache cross toolchain
        if: ${{ !env.ACT }}
        id: cross-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/os1-cross
          key: os1-cross-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('scripts/ci-cross-toolchain.sh') }}

      - name: Build pinned cross toolchain
        if: ${{ !env.ACT && steps.cross-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get install -y build-essential libgmp-dev libmpfr-dev libmpc-dev
          bash scripts/ci-cross-toolchain.sh install "$RUNNER_TEMP/os1-cross" "$(nproc)"

      - name: Verify cross toolchain
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${ACT:-}" = "true" ]; then
            x86_64-elf-gcc --version
            x86_64-elf-g++ --version
            "$(x86_64-elf-gcc -print-prog-name=as)" --version
            x86_64-elf-ld --version
          else
            bash scripts/ci-cross-toolchain.sh check "$RUNNER_TEMP/os1-cross"
            echo "$RUNNER_TEMP/os1-cross/bin" >> "$GITHUB_PATH"
          fi

      # OS1_REQUIRE_UEFI_SMOKE=ON turns a missing OVMF firmware into a
      # configure-time hard error. OS1_KMEM_DEBUG=ON keeps the freestanding
      # CI build aligned with host tests so redzones, poison checks, and leak
      # diagnostics stay exercised even if the root CMake default changes.
      # Firmware discovery itself lives in CMakeLists.txt (single source of
      # truth); this workflow must never re-implement the candidate list.
      - name: Configure
        run: cmake --preset default -DBUILD_TESTING=ON -DOS1_REQUIRE_UEFI_SMOKE=ON -DOS1_KMEM_DEBUG=ON -DOS1_QEMU_DEBUGCON=ON

      - name: Build
        run: |
          cmake --build --preset default
          cmake --build build --target os1_bios_image os1_usb_image

      # Full validation, including diagnostic images, runs locally before push.
      # CMake checks that every required strategic test is registered.
      - name: Strategic smoke tests
        run: ctest --test-dir build --output-on-failure --no-tests=error -L '^ci$'
